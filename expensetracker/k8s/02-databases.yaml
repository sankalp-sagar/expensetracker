# Postgres-per-service (one Deployment + Service each)
# For production: use StatefulSet + StorageClass with proper backups and PVCs.

apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-auth, namespace: expensetracker }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres-auth } }
  template:
    metadata: { labels: { app: postgres-auth } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: authdb }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: expensetracker-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: expensetracker-secrets, key: DB_PASS } }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-auth, namespace: expensetracker }
spec: { selector: { app: postgres-auth }, ports: [{ port: 5432, targetPort: 5432 }] }
