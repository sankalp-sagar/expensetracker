# Platform services: Eureka, API Gateway
apiVersion: apps/v1
kind: Deployment
metadata: { name: eureka-server, namespace: expensetracker }
spec:
  replicas: 1
  selector: { matchLabels: { app: eureka-server } }
  template:
    metadata: { labels: { app: eureka-server } }
    spec:
      containers:
        - name: eureka-server
          image: expensetracker/eureka-server:1.0.0
          ports: [{ containerPort: 8761 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8761 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: eureka-server, namespace: expensetracker }
spec: { selector: { app: eureka-server }, ports: [{ port: 8761, targetPort: 8761 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: expensetracker }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: expensetracker/api-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: expensetracker-config }
            - secretRef: { name: expensetracker-secrets }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: expensetracker }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway-hpa, namespace: expensetracker }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
