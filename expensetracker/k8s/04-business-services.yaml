# Business service deployments. Each is stateless and horizontally scalable.
# Replace the image: tag with your container registry path after `docker build`.

apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: expensetracker }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: expensetracker/auth-service:1.0.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres-auth:5432/authdb" }
          envFrom:
            - configMapRef: { name: expensetracker-config }
            - secretRef: { name: expensetracker-secrets }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 40 }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: expensetracker }
spec: { selector: { app: auth-service }, ports: [{ port: 8081, targetPort: 8081 }] }
---
