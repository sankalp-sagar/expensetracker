x-build-base: &build-base
  context: .
  dockerfile: Dockerfile

services:
  # ---------- Databases ----------
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5433:5432"]
    volumes: [pg_auth:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5434:5432"]
    volumes: [pg_user:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-group:
    image: postgres:16-alpine
    container_name: postgres-group
    environment:
      POSTGRES_DB: groupdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5435:5432"]
    volumes: [pg_group:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-expense:
    image: postgres:16-alpine
    container_name: postgres-expense
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5436:5432"]
    volumes: [pg_expense:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-settlement:
    image: postgres:16-alpine
    container_name: postgres-settlement
    environment:
      POSTGRES_DB: settlementdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5437:5432"]
    volumes: [pg_settlement:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5438:5432"]
    volumes: [pg_notification:/var/lib/postgresql/data]
    networks: [splitnet]

  postgres-analytics:
    image: postgres:16-alpine
    container_name: postgres-analytics
    environment:
      POSTGRES_DB: analyticsdb
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports: ["5439:5432"]
    volumes: [pg_analytics:/var/lib/postgresql/data]
    networks: [splitnet]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]
    networks: [splitnet]

  # ---------- Messaging ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [splitnet]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [splitnet]

  # ---------- Observability ----------
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports: ["9411:9411"]
    networks: [splitnet]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [splitnet]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on: [prometheus]
    networks: [splitnet]

  # ---------- Platform Services ----------
  eureka-server:
    build:
      <<: *build-base
      args: { MODULE: eureka-server }
    container_name: eureka-server
    ports: ["8761:8761"]
    networks: [splitnet]

  config-server:
    build:
      <<: *build-base
      args: { MODULE: config-server }
    container_name: config-server
    ports: ["8888:8888"]
    depends_on: [eureka-server]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
    networks: [splitnet]

  api-gateway:
    build:
      <<: *build-base
      args: { MODULE: api-gateway }
    container_name: api-gateway
    ports: ["8080:8080"]
    depends_on: [eureka-server, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

  # ---------- Business Services ----------
  auth-service:
    build:
      <<: *build-base
      args: { MODULE: auth-service }
    container_name: auth-service
    ports: ["8081:8081"]
    depends_on: [postgres-auth, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-auth:5432/authdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_REDIRECT_BASE: ${OAUTH2_REDIRECT_BASE:-http://localhost:8081}
      OAUTH2_SUCCESS_REDIRECT: ${OAUTH2_SUCCESS_REDIRECT:-http://localhost:3000/oauth2/callback}
    networks: [splitnet]

  user-service:
    build:
      <<: *build-base
      args: { MODULE: user-service }
    container_name: user-service
    ports: ["8082:8082"]
    depends_on: [postgres-user, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-user:5432/userdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

  group-service:
    build:
      <<: *build-base
      args: { MODULE: group-service }
    container_name: group-service
    ports: ["8083:8083"]
    depends_on: [postgres-group, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-group:5432/groupdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

  expense-service:
    build:
      <<: *build-base
      args: { MODULE: expense-service }
    container_name: expense-service
    ports: ["8084:8084"]
    depends_on: [postgres-expense, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-expense:5432/expensedb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-none}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
    volumes:
      - ./uploads:/app/uploads
    networks: [splitnet]

  settlement-service:
    build:
      <<: *build-base
      args: { MODULE: settlement-service }
    container_name: settlement-service
    ports: ["8085:8085"]
    depends_on: [postgres-settlement, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-settlement:5432/settlementdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

  notification-service:
    build:
      <<: *build-base
      args: { MODULE: notification-service }
    container_name: notification-service
    ports: ["8086:8086"]
    depends_on: [postgres-notification, eureka-server, kafka]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-notification:5432/notificationdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

  analytics-service:
    build:
      <<: *build-base
      args: { MODULE: analytics-service }
    container_name: analytics-service
    ports: ["8087:8087"]
    depends_on: [postgres-analytics, eureka-server, kafka, redis]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-analytics:5432/analyticsdb
      DB_USER: splitwise
      DB_PASS: splitwise
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-very-long-secret-key-256-bits}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks: [splitnet]

volumes:
  pg_auth:
  pg_user:
  pg_group:
  pg_expense:
  pg_settlement:
  pg_notification:
  pg_analytics:

networks:
  splitnet:
    driver: bridge
